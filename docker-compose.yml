    image: ghcr.io/bastianns/sensian-frontend:latest
    ports:
      - "3000:3000"
    environment:
      REACT_APP_BACKEND_URL: https://sensiwithme.my.id/api
      REACT_APP_ENV: production
      REACT_APP_ALLOWED_FILE_TYPES: mp4,avi,mov
      REACT_APP_MAX_UPLOAD_SIZE: 50MB
    networks:
      - sensian-network
    depends_on:
      - backend

  sensian-db:
    image: postgres:13
    environment:
      POSTGRES_USER: sentiment_user
      POSTGRES_PASSWORD: StrongPassword123!
      POSTGRES_DB: sentiment_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sensian-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentiment_user -d sentiment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sensian-network:
    driver: bridge

volumes:
  postgres_data:
